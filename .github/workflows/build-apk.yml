name: Build APK

# 零配置即可运行：检测到仓库配置了签名 Secrets（SIGNING_KEY / KEY_STORE_PASSWORD /
# ALIAS / KEY_PASSWORD）时，Release 变体使用正式签名；否则自动回退到 debug 签名，
# 保证 Fork 之后无需任何密钥也能产出 APK。密钥仅存在于 GitHub Secrets，从不入库。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
          - both
      run_desktop_check:
        description: "同时编译校验桌面端与公共共享模块"
        required: false
        default: false
        type: boolean
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 显式保留 UTF-8，确保中文别名在 JVM 内正确解码。
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      # 直接使用 runner 预装的 Android SDK，写入许可文件后由 AGP 按需下载缺失组件。
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK components
        continue-on-error: true
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 可选：编译公共模块 + 桌面端，用于确认改动没有破坏跨平台共享代码。
      - name: Compile desktop & shared modules
        if: ${{ inputs.run_desktop_check }}
        run: ./gradlew :app:shared:compileKotlinDesktop --stacktrace

      # 未配置 KEYSTORE_PATH 时，app/android 的 release 变体会回退到 debug 签名配置，
      # 因此 assembleRelease 在无密钥环境下同样可以构建成功。
      # 只判断 Secrets 是否齐全并输出布尔值，任何密钥内容都不会进入日志。
      - name: Resolve signing configuration
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ] && [ -n "${{ secrets.KEY_STORE_PASSWORD }}" ] \
             && [ -n "${{ secrets.ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo ">> signing secrets detected"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo ">> no signing secrets, release will fall back to the debug signing config"
          fi

      # 密钥写在 $RUNNER_TEMP（仓库工作区之外），构建结束即随 runner 销毁。
      - name: Decode Signing Key
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          test -s "$RUNNER_TEMP/keystore.jks" && echo ">> keystore decoded"

      - name: Build APK
        env:
          SECRET_KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Build type: $TYPE"
          # Release 需要正式签名；debug 变体始终使用 Android 默认 debug 密钥。
          if [ "${{ steps.signing.outputs.available }}" = "true" ] \
             && { [ "$TYPE" = "release" ] || [ "$TYPE" = "both" ]; }; then
            export KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
            export KEYSTORE_PASS="$SECRET_KEYSTORE_PASS"
            export KEY_ALIAS="$SECRET_ALIAS"
            export KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            echo ">> release build will be signed with the configured keystore"
          fi
          case "$TYPE" in
            debug)   ./gradlew :app:android:assembleDebug --stacktrace ;;
            release) ./gradlew :app:android:assembleRelease --stacktrace ;;
            both)    ./gradlew :app:android:assembleDebug :app:android:assembleRelease --stacktrace ;;
          esac

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find app/android/build/outputs/apk -type f -name '*.apk' -exec cp {} apk-output/ \;
          ls -lh apk-output

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppMarket-APK-${{ github.run_number }}
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write Build Summary
        run: |
          {
            echo "## 📦 APK 构建结果"
            echo ""
            echo "| APK | 大小 | SHA256 |"
            echo "| --- | --- | --- |"
            for f in apk-output/*.apk; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | awk '{print $1}')\` |"
            done
            echo ""
            echo "构建类型：\`${{ inputs.build_type || 'debug' }}\` · 提交：\`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
