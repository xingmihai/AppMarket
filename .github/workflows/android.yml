name: Android CI

# 发布用工作流：打 v* 标签或手动触发。
# 未配置签名 Secrets 时会自动回退到 debug 签名配置，不会因缺少密钥而构建失败。
# 日常提交构建请使用 build-apk.yml。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 只输出布尔值，不输出任何密钥内容。
      - name: Resolve signing configuration
        id: signing
        run: echo "available=${{ secrets.SIGNING_KEY != '' && secrets.KEY_STORE_PASSWORD != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode Signing Key
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > keystore.jks

      - name: Build Release APK
        env:
          SECRET_KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
            export KEYSTORE_PASS="$SECRET_KEYSTORE_PASS"
            export KEY_ALIAS="$SECRET_ALIAS"
            export KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            echo ">> signed release build"
          else
            echo ">> no signing secrets configured, falling back to the debug signing config"
          fi
          ./gradlew :app:android:assembleRelease --stacktrace
          echo "APK_FILE=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)" >> $GITHUB_ENV

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
